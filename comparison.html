<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //==,===,,<>,<=,>=, !=
        let num = 10
        document.write((num = '10') + "<br>")
        document.write((num === '10') + "<br>")
        document.write((num < 11) + "<br>")
        document.write((num > 11) + "<br>")
        document.write((num <= 10) + "<br>")
        document.write((num >= 10) + "<br>")
        document.write((num != 10) + "<br>")
    </script>

</body>

</html>
