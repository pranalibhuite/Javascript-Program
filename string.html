<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>Javascript is a obJECT OrienTED pROGRAmming Lang.</p>
    <script>
        let str = 'Javascript is a obJECT OrienTED pROGRAmming Lang.'

        document.write(str.length + "<br>")
        document.write(str.length + "<br>")



        document.write(str.toLowerCase() + "<br>")
        document.write(str.toUpperCase() + "<br>")

        document.write(str.trim() + "<br>")
        document.write(str.trimStart() + "<br>")
        document.write(str.trimEnd() + "<br>")

        let num = 23;
        document.write(typeof (num.toString()) + "<br>")
        document.write(str.indexOf('a') + "<br>")
        document.write(str.lastIndexOf('a') + "<br>")
        document.write(str.charAt(3) + "<br>")
        document.write(str.charCodeAt(2) + "<br>")


        let str2 = 'react and '
        let str3 = 'Angular'
        let str4 = 'both are the liabary and framework.'

        document.write(str4.concat(str2, str3) + "<br>")

        document.write(str.startsWith('Java') + "<br>")
        document.write(str.endsWith('.') + "<br>")
        document.write(String.fromCharCode(65) + "<br>")
        document.write(str.includes('script') + "<br>")


        let str5 = 'hello'
        document.write(str5.repeat(5) + "<br>")
        document.write(str.replace("Javascript", "react") + "<br>")

        document.write(str.search('va') + "<br>")
        document.write(str.slice(2, 5) + "<br>")
        document.write(str.split('') + "<br>")
        document.write(str.length + "<br>")


    </script>
</body>

</html>
