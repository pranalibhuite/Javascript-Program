<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let num1=10;
        let num2=10;


        let a=(num1===10 &&  num2===10)
        document.write(a+ "<br>")

        let b=(num1==='10' || num2===10)
        document.write(b+"<br>")

        document.write((!num1===10))

        
    </script>
