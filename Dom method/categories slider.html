    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f0f2f6;
        }

        .category-section{
            width: 100%;
            background-color: white;
            padding: 30px 40px;
              border: 1px solid black;
            border-radius: 10px;
            margin: auto;
            
        }
        .heading{
            font-size: 22px;
            margin-bottom: 22px;
        }
        .slider{
            position: relative;
            width: 100%;
            overflow: hidden;
            padding: 5px 45px;
          

        }
        .category-track{
            display: flex;
            width: 90%;
            gap: 25px;
            transition: transform 0.5s ease;

        }
        .category{
            min-width:130px;
            text-align: center;
            flex-shrink: 0;
            cursor: pointer;

        }
        .image-box{
            width: 110px;
            height: 100px;
            margin: auto;
            border: 1px solid black;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;

        }
        .image-box img{
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .arrow{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 70px;
            background: white;
            border: none;
            outline: none;
            border: 1px solid rgb(46, 46, 46);
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            transform: 0.3s;
            box-shadow: 0 2px 5px rgba(116, 116, 116, 0.365);

        }
        .left-arrow{
            left: 0;
            
display: none;

        }
        .right-arrow{
            right: 0;
        }
         .arrow.disabled{
        opacity:0.3;
        cursor:not-allowed

        } 
        
    </style>
</head>

    <script>
  let track=document.getElementById('categorytrack')
const leftArrow=document.getElementById("leftArrow")
const rightArrow=document.getElementById('rightArrow')
let categories=document.querySelectorAll('.category')
let currentIndex=0;

//how many item visible
function getVisibile(){
    let slider=document.querySelector('.slider')
    const categoryWidth=categories[0].offsetWidth;
    const gap=25;
    const availabaleWidth=slider.clientWidth-90;

    return Math.floor(
        availabaleWidth/(categoryWidth+gap)
    )

    
}
//moveslider
function moveslider(){
    const categoryWidth=categories[0].offsetWidth;
    const gap=45;

    // first movement=category width(130px)+gap
    let moveAmount=categoryWidth+gap;

    track.style.transform=`translateX(-${currentIndex*moveAmount}px)`;
    updateArrows()

}

rightArrow.addEventListener("click",function(){
    const visibleItems=getVisibile()

    const maxIndex=categories.length-visibleItems

    //move only one items
    if(currentIndex<maxIndex){
        currentIndex++;
        moveslider()
    }

})

//left arrow
leftArrow.addEventListener("click",function(){
    //move only one item
    if(currentIndex>0){
        currentIndex--
        moveslider()
    }
})


function updateArrows(){
    const visibleItems=getVisibile()
    const maxIndex=categories.length-visibleItems

    if(currentIndex===0){
        leftArrow.classList.add("disabled")
    }
    else{
        leftArrow.classList.remove("disabled")
        leftArrow.style.display='block'
    }

    if(currentIndex>=maxIndex){
        rightArrow.classList.add("disabled")
    }
    else{
        rightArrow.classList.remove("disabled")
    }
}
    </script>
