<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let no1 = 10;
        // let no2=20;
        // assignment operator
        document.write(no1 + "<br>")
        document.write((no1 += 40) + "<br>")
        document.write((no1 -= 40) + "<br>")
        document.write((no1 *= 40) + "<br>")
        document.write((no1 %= 40) + "<br>")
        document.write((no1 **= 40) + "<br>")
    </script>

</body>

</html>
