<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let a=20.23
        console.log(typeof(a))

        let b="hello it's'"
        console.log(typeof(b))

        let c=true
        console.log(typeof(c))


        let d=null
        console.log(typeof(d))

        let e;
        console.log(typeof(e))

        let f=1234444444444444444444444444444444444444444444n
        console.log(typeof(f))

        let g = Symbol('20')
        console.log(typeof(g))
          
        // Nan
         let w=10-"hii"
         console.log(10-"hii")
        // non-primitive datatype
        let test={
            name:'seven mentor',
            mobileno:1234567,
            email:'info@gmail.com',
            isLoggedIn:false,
            age:30
        }

        console.log(typeof(test))

        let p=['js',1995,true,,null]
        console.log(p)
        console.log(typeof(p))

    </script>
    
</body>
</html>
